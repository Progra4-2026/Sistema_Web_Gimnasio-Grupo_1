spring.application.name=gimnasio-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/gimnasio_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Nunca enviar trazas del sistema al cliente
server.error.include-stacktrace=never
# Cookie de sesión (HttpSession): no accesible desde JavaScript; expira tras 30 min de inactividad
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m
