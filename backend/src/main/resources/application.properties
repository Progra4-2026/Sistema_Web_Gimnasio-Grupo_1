spring.application.name=gimnasio-backend

server.port=8080

# Credenciales de MySQL: se leen de backend/.env (no se sube al repo, ver .env.example).
# Si no existe .env, se usan los valores por defecto después de los ":" (root/root en localhost).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gimnasio_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Protección contra inyección SQL: todo acceso a datos pasa por el ORM (repositorios JPA).
# Hibernate genera sentencias preparadas con parámetros "?" (ver la consola con show-sql);
# para ver además los valores enviados en cada parámetro, descomentar la línea siguiente:
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Las consultas a la base se hacen dentro de los servicios (@Transactional), no al armar la respuesta
spring.jpa.open-in-view=false
# Nunca enviar trazas del sistema al cliente
server.error.include-stacktrace=never
# Cookie de sesión (HttpSession): no accesible desde JavaScript; expira tras 30 min de inactividad
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m
# Servicio SOAP de cursos (Spring Web Services): http://localhost:8080/ws, WSDL en /ws/cursos.wsdl
spring.webservices.path=/ws
spring.webservices.servlet.init.transformWsdlLocations=true

# CORS: orígenes que pueden consumir la API (separados por coma). Ver config/CorsConfig.java
app.cors.origenes-permitidos=http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1
